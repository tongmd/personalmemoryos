[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalmemoryos"
version = "0.1.0"
description = "Scoped, Git-versioned memory that learns from user corrections across agent sessions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tongmd"}]
dependencies = []
keywords = ["agents", "memory", "mcp", "git", "personalization"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["ruff>=0.11"]

[project.scripts]
pmos = "personalmemoryos.cli:main"

[project.urls]
Homepage = "https://github.com/tongmd/personalmemoryos"
Issues = "https://github.com/tongmd/personalmemoryos/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
